name: Build and deploy the project to EC2

# Event trigger : runs when a pull request is opened in the repo or manual
on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
    branches:
      - 'feature/*'
  push:
    branches:
      - main
      - 'feature/*'
#    paths-ignore:
#      - '.github/workflows/*'

# actual jobs definition, this has 3 jobs
jobs:
  build:
    runs-on: ubuntu-latest # the runner
    steps:
      - name: 'Get code'
        uses: actions/checkout@v7
      - name: 'Install Java 25 on the runner'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - run: gradle build
      - name: 'Run tests'
        run: gradle test
      - name: 'Create artifacts'
        uses: actions/upload-artifact@v7
        with:
          name: jar-file
          path: |
            build/libs/*-SNAPSHOT.jar
            reports/tests/index.html
  deploy:
    needs: [ build ]
    runs-on: ubuntu-latest # the runner
    steps:
      - name: 'Download artifacts'
        uses: actions/download-artifact@v7
        with:
          name: jar-file
      - name: 'List contents'
        run: ls
      - name: 'Get code'
        uses: actions/checkout@v7
      - name: 'Install Java 25 on the runner'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: 'Deploy to EC2'
        run: echo "Deployed to EC2...!"
  printContextData:
    runs-on: ubuntu-latest # the runner
    steps:
      - name: 'Prints the context data using expressions'
        run: echo "${{ toJSON(github) }}"